<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Rumbo Sur</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="destinos.html">Destinos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>

    <main>

        <section>

            <h1>Contactanos</h1>

            <p>
                Completá el formulario y contanos cuál es
                el destino que te gustaría conocer.
            </p>

        </section>

        <section>

            <h2>Formulario de contacto</h2>

            <form action="https://formspree.io/f/xxxxxxxx"
                  method="POST">

                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="email"
                    required
                >

                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    required>
                </textarea>

                <button type="submit">
                    Enviar consulta
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            Rumbo Sur · Turismo por Argentina · 2026
        </p>

    </footer>

</body>

</html>
